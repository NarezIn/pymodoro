[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyodoro"
version = "1.1.0"
description = "A background Pomodoro timer with prompt-integrated progress bars — start a session and keep using your terminal"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name="Simon Ni"},
]
keywords = ["pomodoro", "timer", "productivity", "TUI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "emoji"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "*/__main__.py"
]

[project.scripts]
pymodoro = "pomodoro.__main__:main"

[project.urls]
Homepage = "https://github.com/NarezIn/pymodoro"
Documentation = "https://github.com/NarezIn/pymodoro#readme"